name: Chart hashes

on:
  push:
    branches: ["renovate/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: chart-hashes-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Fix chart hashes
        if: startsWith(github.head_ref || github.ref_name, 'renovate/')
        run: nix run .#fix-chart-hashes

      - name: Check chart hashes
        if: "!startsWith(github.head_ref || github.ref_name, 'renovate/')"
        run: nix run .#fix-chart-hashes -- --check

      - name: Evaluate system
        run: nix eval .#nixosConfigurations.freia.config.system.build.toplevel.drvPath

      - name: Push fixed hashes
        if: startsWith(github.head_ref || github.ref_name, 'renovate/')
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix(k3s): update chart hashes"
          git push
