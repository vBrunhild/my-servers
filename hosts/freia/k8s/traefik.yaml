apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  repo: https://helm.traefik.io/traefik
  chart: traefik
  version: "39.0.5"
  targetNamespace: traefik
  values:
    deployment:
      replicas: 1

    ports:
      web:
        port: 80
        exposedPort: 80
        redirectTo:
          port: websecure
      websecure:
        port: 443
        exposedPort: 443
        tls:
          enabled: true

    service:
      type: ClusterIP

    hostNetwork: true

    certResolvers:
      cloudflare:
        email: your@email.com
        storage: /data/acme.json
        dnsChallenge:
          provider: cloudflare
          resolvers:
            - "1.1.1.1:53"

    env:
      - name: CF_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: token

    persistence:
      enabled: true
      path: /data
      size: 128Mi

    ingressClass:
      enabled: true
      isDefaultIngressClass: true

    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
